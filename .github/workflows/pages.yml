# GitHub Pages: builds the MkDocs Material site and publishes it.
# README.md is the single source, copied into docs/ at build time so the
# repository stays a clean single-README project (mirrors .gitlab-ci.yml).
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The site then publishes on every push to main.

name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install --no-cache-dir "mkdocs-material>=9.5,<10"
      - name: Assemble docs
        run: |
          mkdir -p docs/assets
          cp README.md docs/index.md
          cp -r assets/* docs/assets/ 2>/dev/null || true
      - name: Build site
        run: mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
